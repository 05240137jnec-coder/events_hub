<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JNEC Events Hub — Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- HEADER (Includes Dark Mode button) -->
  <header id="top">
    <h1>JNEC Events Hub</h1>
    <button type="button" id="darkToggle" class="btn btn-sm btn-outline-light">Dark mode</button>
    <nav>
      <a href="index.html">Home</a>
      <a href="events.html">Events</a>
      <a href="register.html">Register</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <!-- MAIN CONTENT -->
  <main>
    <div class="container py-4">
      <h2 class="mb-4">Event registration</h2>
      
      <form action="#" method="post" enctype="multipart/form-data" id="regForm">
        
        <!-- 1. PERSONAL DETAILS -->
        <fieldset class="mb-4">
          <legend>Personal Details</legend>
          
          <div class="mb-3">
            <label for="fullname" class="form-label">Full name</label>
            <input type="text" class="form-control" id="fullname" name="fullname">
            <!-- Error span for fullname -->
            <span id="err-fullname" class="error"></span>
          </div>
          
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="text" class="form-control" id="email" name="email">
            <!-- Error span for email -->
            <span id="err-email" class="error"></span>
          </div>
          
          <div class="mb-3">
            <label for="phone" class="form-label">Phone</label>
            <input type="text" class="form-control" id="phone" name="phone">
            <!-- Error span for phone -->
            <span id="err-phone" class="error"></span>
          </div>
        </fieldset>

        <!-- 2. EVENT CHOICE -->
        <fieldset class="mb-4">
          <legend>Event Choice</legend>
          
          <div class="mb-3">
            <label for="event_id" class="form-label">Event</label>
            <select class="form-select" id="event_id" name="event_id">
              <option value="">-- choose an event --</option>
              <!-- Options will be dynamically generated by main.js -->
            </select>
            <!-- Error span for event selection -->
            <span id="err-event_id" class="error"></span>
            <!-- Seats Hint text -->
            <p id="seatsHint" class="seats-hint mt-2">Choose an event to see remaining seats.</p>
          </div>
          
          <p>Food preference:</p>
          <div class="form-check">
            <input class="form-check-input" type="radio" id="veg" name="food" value="veg">
            <label class="form-check-label" for="veg">Vegetarian</label>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="radio" id="nonveg" name="food" value="nonveg">
            <label class="form-check-label" for="nonveg">Non-vegetarian</label>
          </div>
          <!-- Error span for food preference -->
          <span id="err-food" class="error"></span>

          <p>Interested in:</p>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="volunteer" name="interests" value="volunteer">
            <label class="form-check-label" for="volunteer">Volunteering</label>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="perform" name="interests" value="perform">
            <label class="form-check-label" for="perform">Performing</label>
          </div>
          <!-- Error span for interests checkboxes -->
          <span id="err-interests" class="error"></span>
        </fieldset>

        <!-- 3. OTHER -->
        <fieldset class="mb-4">
          <legend>Other</legend>
          
          <div class="mb-3">
            <label for="department" class="form-label">Department</label>
            <select class="form-select" id="department" name="department">
              <option value="it">Information Technology</option>
              <option value="civil">Civil</option>
              <option value="electrical">Electrical</option>
            </select>
          </div>
          
          <div class="mb-3">
            <label for="remarks" class="form-label">Remarks</label>
            <textarea class="form-control" id="remarks" name="remarks" rows="4" maxlength="200"></textarea>
            <!-- Character counter for remarks -->
            <span id="charCount" class="text-muted">0/200</span>
          </div>
          
          <div class="mb-3">
            <label for="id_card" class="form-label">Student ID card (image)</label>
            <input class="form-control" type="file" id="id_card" name="id_card">
          </div>
        </fieldset>

        <!-- BUTTONS -->
        <button type="submit" class="btn btn-primary">Register</button>
        <button type="reset" class="btn btn-outline-secondary">Clear</button>
      </form>
    </div>
  </main>

  <!-- FOOTER (Includes Year span for JS) -->
  <footer>
    <p>&copy; <span id="year"></span> JNEC Events Hub</p>
  </footer>

  <!-- SCRIPTS (Bootstrap, then main.js, then validate.js) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/validate.js"></script>
</body>
</html>
